<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16352b" flood-opacity="0.12"/></filter>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#21745c"/></marker>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#315ea8"/></marker>
    <style>
      .title{font:700 42px 'Segoe UI',Arial,sans-serif;fill:#123b2f}.sub{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#52665f}
      .lane{font:700 22px 'Segoe UI',Arial,sans-serif}.h{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#173c31}.b{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#4b6058}.w{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#fff}.ws{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#e9f6f1}
      .edge{fill:none;stroke:#21745c;stroke-width:5;marker-end:url(#ag)}.edgeBlue{fill:none;stroke:#315ea8;stroke-width:5;marker-end:url(#ab)}.edgeDash{fill:none;stroke:#71827c;stroke-width:4;stroke-dasharray:11 9;marker-end:url(#ag)}
    </style>
  </defs>
  <rect width="1800" height="1280" fill="#f5f7f3"/>
  <text x="90" y="75" class="title">Flujo de una operación en DonationChain</text>
  <text x="90" y="112" class="sub">Registro de una donación o gasto, revisión independiente y verificación en Blockchain</text>

  <g filter="url(#shadow)"><rect x="650" y="150" width="500" height="90" rx="45" fill="#0f5b45"/></g>
  <text x="900" y="188" text-anchor="middle" class="w">Inicio</text><text x="900" y="217" text-anchor="middle" class="ws">Usuario inicia sesión y selecciona una campaña</text>
  <path d="M900 240 V295" class="edge"/>

  <g filter="url(#shadow)"><polygon points="900,295 1050,370 900,445 750,370" fill="#fff8e8" stroke="#d7a84b" stroke-width="3"/></g>
  <text x="900" y="360" text-anchor="middle" class="h">¿Qué operación</text><text x="900" y="389" text-anchor="middle" class="h">se registra?</text>

  <rect x="70" y="485" width="790" height="585" rx="30" fill="#edf5f0" stroke="#b3d0c3" stroke-width="2"/>
  <rect x="940" y="485" width="790" height="585" rx="30" fill="#fff8e8" stroke="#e2c46d" stroke-width="2"/>
  <text x="110" y="530" class="lane" fill="#21654f">RUTA A · DONACIÓN</text>
  <text x="980" y="530" class="lane" fill="#8a6421">RUTA B · GASTO</text>

  <path d="M750 370 H465 V560" class="edge"/><text x="580" y="350" class="b">Donación</text>
  <path d="M1050 370 H1335 V560" class="edge"/><text x="1160" y="350" class="b">Gasto</text>

  <g filter="url(#shadow)">
    <rect x="155" y="560" width="620" height="80" rx="20" fill="#fff"/>
    <rect x="155" y="680" width="620" height="80" rx="20" fill="#fff"/>
    <rect x="155" y="800" width="620" height="80" rx="20" fill="#fff"/>
    <rect x="155" y="920" width="620" height="95" rx="20" fill="#0f5b45"/>
  </g>
  <text x="465" y="592" text-anchor="middle" class="h">1. Captura y validación</text><text x="465" y="620" text-anchor="middle" class="b">Monto positivo · fecha · campaña activa</text>
  <text x="465" y="712" text-anchor="middle" class="h">2. Registro en base de datos</text><text x="465" y="740" text-anchor="middle" class="b">ID único · cantidad · donante · campaña</text>
  <text x="465" y="832" text-anchor="middle" class="h">3. Acuse y auditoría</text><text x="465" y="860" text-anchor="middle" class="b">Se genera comprobante para el donante y entrada auditada</text>
  <text x="465" y="955" text-anchor="middle" class="w">4. Hash SHA-256</text><text x="465" y="984" text-anchor="middle" class="ws">Huella verificable de la operación</text>
  <path d="M465 640 V680" class="edge"/><path d="M465 760 V800" class="edge"/><path d="M465 880 V920" class="edge"/>

  <g filter="url(#shadow)">
    <rect x="1025" y="560" width="620" height="80" rx="20" fill="#fff"/>
    <rect x="1025" y="675" width="620" height="95" rx="20" fill="#fff"/>
    <rect x="1025" y="805" width="290" height="95" rx="20" fill="#fdeeee" stroke="#df8f8f"/>
    <rect x="1355" y="805" width="290" height="95" rx="20" fill="#e8f5ee" stroke="#80b99e"/>
    <rect x="1190" y="940" width="290" height="75" rx="20" fill="#0f5b45"/>
  </g>
  <text x="1335" y="592" text-anchor="middle" class="h">1. Gasto y comprobante</text><text x="1335" y="620" text-anchor="middle" class="b">Concepto · monto · PDF/imagen · saldo disponible</text>
  <text x="1335" y="708" text-anchor="middle" class="h">2. Revisión del auditor</text><text x="1335" y="737" text-anchor="middle" class="b">Evidencia, descripción, cantidad y reglas del sistema</text>
  <text x="1170" y="842" text-anchor="middle" class="h">Rechazado</text><text x="1170" y="872" text-anchor="middle" class="b">Justificación + auditoría</text>
  <text x="1500" y="842" text-anchor="middle" class="h">Aprobado</text><text x="1500" y="872" text-anchor="middle" class="b">Asigna donaciones y actualiza saldo</text>
  <text x="1335" y="973" text-anchor="middle" class="w">3. Hash SHA-256</text><text x="1335" y="999" text-anchor="middle" class="ws">Comprobante + decisión auditada</text>
  <path d="M1335 640 V675" class="edge"/>
  <path d="M1335 770 V790 H1170 V805" class="edge"/><path d="M1335 790 H1500 V805" class="edge"/>
  <path d="M1170 900 V925 H1335 V940" class="edge"/><path d="M1500 900 V925 H1335 V940" class="edge"/>

  <rect x="70" y="1110" width="1660" height="120" rx="28" fill="#edf3fb" stroke="#9eb6da" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="130" y="1135" width="300" height="70" rx="18" fill="#fff"/>
    <rect x="555" y="1135" width="310" height="70" rx="18" fill="#fff"/>
    <rect x="990" y="1135" width="310" height="70" rx="18" fill="#315ea8"/>
    <rect x="1425" y="1135" width="245" height="70" rx="18" fill="#fff"/>
  </g>
  <text x="280" y="1178" text-anchor="middle" class="h">Web3.py + JSON-RPC</text>
  <text x="710" y="1178" text-anchor="middle" class="h">Contrato DonationTraceability</text>
  <text x="1145" y="1178" text-anchor="middle" class="w">Ethereum Sepolia PoS</text>
  <text x="1548" y="1165" text-anchor="middle" class="h">Verificación</text><text x="1548" y="1191" text-anchor="middle" class="b">Hash coincide / advertencia</text>

  <path d="M465 1015 V1080 H280 V1135" class="edgeBlue"/>
  <path d="M1335 1015 V1080 H280 V1135" class="edgeBlue"/>
  <path d="M430 1170 H555" class="edgeBlue"/><path d="M865 1170 H990" class="edgeBlue"/><path d="M1300 1170 H1425" class="edgeBlue"/>
  <path d="M1548 1135 V1085 H900 V1045" class="edgeDash"/>

  <text x="900" y="1262" text-anchor="middle" class="b">La información completa permanece fuera de la cadena; Blockchain conserva hashes y evidencia verificable.</text>
</svg>
