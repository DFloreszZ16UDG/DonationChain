    <marker id="r2" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14Z" fill="#b65353"/></marker>
    <style>
      .title{font:700 44px Arial,sans-serif;fill:#083d33}.subtitle{font:400 21px Arial,sans-serif;fill:#425b53}
      .lane{font:700 22px Arial,sans-serif;letter-spacing:.5px}.h{font:700 21px Arial,sans-serif;fill:#083d33}
      .p{font:400 16px Arial,sans-serif;fill:#40564f}.sm{font:400 14px Arial,sans-serif;fill:#52675f}
      .wh{font:700 21px Arial,sans-serif;fill:#fff}.wp{font:400 16px Arial,sans-serif;fill:#eaf2ff}
