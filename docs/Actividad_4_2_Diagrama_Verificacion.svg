  <rect width="1800" height="1000" fill="url(#bg2)"/>
  <circle cx="1650" cy="55" r="235" fill="#dcebe4" opacity=".72"/>

  <text x="82" y="76" class="title">Consulta y verificación de un registro en Blockchain</text>
  <text x="82" y="112" class="subtitle">DonationChain compara la evidencia local con el Smart Contract desplegado en Ethereum Sepolia</text>

  <rect x="68" y="155" width="1664" height="310" rx="28" fill="#ffffff" stroke="#afd2c3" stroke-width="2"/>
  <text x="96" y="197" class="lane" fill="#11604e">APLICACIÓN Y DATOS LOCALES · OFF-CHAIN</text>

  <g filter="url(#s2)"><rect x="105" y="248" width="250" height="140" rx="22" fill="#ffffff"/><text x="230" y="294" text-anchor="middle" class="h">Donante o auditor</text><text x="230" y="329" text-anchor="middle" class="p">Selecciona “Verificar”</text><text x="230" y="357" text-anchor="middle" class="sm">desde la interfaz React</text></g>
  <path d="M355 318 H435" stroke="#19745e" stroke-width="5" fill="none" marker-end="url(#g2)"/>
  <g filter="url(#s2)"><rect x="460" y="238" width="270" height="160" rx="22" fill="#f2faf6" stroke="#86c4ad" stroke-width="2"/><text x="595" y="286" text-anchor="middle" class="h">API FastAPI</text><text x="595" y="322" text-anchor="middle" class="p">Autorización y reglas</text><text x="595" y="351" text-anchor="middle" class="p">GET /blockchain/verify/{id}</text><text x="595" y="377" text-anchor="middle" class="sm">Respuesta JSON</text></g>
  <path d="M730 318 H810" stroke="#19745e" stroke-width="5" fill="none" marker-end="url(#g2)"/>
  <g filter="url(#s2)"><rect x="835" y="238" width="290" height="160" rx="22" fill="#fff8e9" stroke="#e6bb62" stroke-width="2"/><text x="980" y="286" text-anchor="middle" class="h">AuditLog + base de datos</text><text x="980" y="322" text-anchor="middle" class="p">entry_hash esperado</text><text x="980" y="351" text-anchor="middle" class="p">tx hash · bloque · estado</text><text x="980" y="377" text-anchor="middle" class="sm">Evidencia local canónica</text></g>
  <path d="M1125 318 H1205" stroke="#19745e" stroke-width="5" fill="none" marker-end="url(#g2)"/>
  <g filter="url(#s2)"><rect x="1230" y="238" width="285" height="160" rx="22" fill="#eaf1fc" stroke="#8cace0" stroke-width="2"/><text x="1372" y="286" text-anchor="middle" class="h">Web3.py</text><text x="1372" y="322" text-anchor="middle" class="p">Obtiene recordId y dataHash</text><text x="1372" y="351" text-anchor="middle" class="p">Comprueba chain ID de Sepolia</text><text x="1372" y="377" text-anchor="middle" class="sm">Conexión mediante JSON-RPC</text></g>
  <path d="M1515 318 H1635 V520" stroke="#3565ad" stroke-width="5" fill="none" marker-end="url(#b2)"/>

  <rect x="68" y="505" width="1664" height="330" rx="28" fill="#eaf1fc" stroke="#8eafe5" stroke-width="2"/>
  <text x="96" y="548" class="lane" fill="#2d5da7">ETHEREUM SEPOLIA · ON-CHAIN · PROOF OF STAKE</text>

  <g filter="url(#s2)"><rect x="1350" y="585" width="310" height="170" rx="22" fill="#3565ad"/><text x="1505" y="632" text-anchor="middle" class="wh">Nodo Ethereum / RPC</text><text x="1505" y="669" text-anchor="middle" class="wp">Consulta de solo lectura</text><text x="1505" y="699" text-anchor="middle" class="wp">sin crear una transacción nueva</text><text x="1505" y="729" text-anchor="middle" class="wp">Red real de prueba</text></g>
  <path d="M1350 670 H1250" stroke="#3565ad" stroke-width="5" fill="none" marker-end="url(#b2)"/>
  <g filter="url(#s2)"><rect x="925" y="585" width="300" height="170" rx="22" fill="#ffffff" stroke="#7fa2db" stroke-width="2"/><text x="1075" y="632" text-anchor="middle" class="h">DonationTraceability</text><text x="1075" y="668" text-anchor="middle" class="p">verifyRecord(recordId, hash)</text><text x="1075" y="699" text-anchor="middle" class="p">Compara bytes32</text><text x="1075" y="729" text-anchor="middle" class="sm">Devuelve true o false</text></g>
  <path d="M925 670 H825" stroke="#3565ad" stroke-width="5" fill="none" marker-end="url(#b2)"/>

  <g filter="url(#s2)"><polygon points="680,570 825,670 680,770 535,670" fill="#fff7e6" stroke="#dba23b" stroke-width="3"/><text x="680" y="657" text-anchor="middle" class="h">¿Hash local =</text><text x="680" y="688" text-anchor="middle" class="h">hash on-chain?</text></g>

  <path d="M535 640 H420" stroke="#19745e" stroke-width="5" fill="none" marker-end="url(#g2)"/>
  <text x="474" y="620" text-anchor="middle" class="lab" fill="#11604e">SÍ</text>
  <g filter="url(#s2)"><rect x="145" y="560" width="250" height="150" rx="22" fill="#e8f8f0" stroke="#65b799" stroke-width="2"/><text x="270" y="609" text-anchor="middle" class="h">Verificación correcta</text><text x="270" y="645" text-anchor="middle" class="p">El hash coincide</text><text x="270" y="676" text-anchor="middle" class="sm">Integridad confirmada</text></g>

  <path d="M680 770 V805 H430" stroke="#b65353" stroke-width="5" fill="none" marker-end="url(#r2)"/>
  <text x="622" y="797" class="lab" fill="#a83e3e">NO</text>
  <g filter="url(#s2)"><rect x="145" y="745" width="250" height="145" rx="22" fill="#fff0f0" stroke="#df8686" stroke-width="2"/><text x="270" y="791" text-anchor="middle" class="h">Advertencia</text><text x="270" y="827" text-anchor="middle" class="p">La evidencia no coincide</text><text x="270" y="858" text-anchor="middle" class="sm">Revisar alteración o registro</text></g>

  <path d="M270 710 V735" stroke="#71827b" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
  <path d="M395 635 H455 V875 H1190" stroke="#71827b" stroke-width="3" stroke-dasharray="9 8" fill="none" marker-end="url(#g2)"/>
  <g filter="url(#s2)"><rect x="1215" y="850" width="445" height="95" rx="22" fill="#ffffff" stroke="#9eb0a9"/><text x="1437" y="887" text-anchor="middle" class="h">Resultado visible y verificable</text><text x="1437" y="919" text-anchor="middle" class="p">Estado · tx hash · bloque · escritor · enlace al explorador</text></g>

  <text x="82" y="970" class="sm">DonationChain · La consulta de verifyRecord es de lectura: no modifica la red ni genera un nuevo gasto de gas.</text>
