[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
  "B008", # FastAPI intentionally declares dependencies in default arguments.
  "BLE001", # RPC boundaries translate third-party failures into API status.
  "UP042", # str + Enum remains explicit for SQLAlchemy/Pydantic compatibility.
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

